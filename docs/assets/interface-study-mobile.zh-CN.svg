<svg xmlns="http://www.w3.org/2000/svg" width="400" height="640" viewBox="791 8 400 640" role="img" aria-labelledby="title desc">
  <title id="title">UI Foundry 原创界面设计示例</title>
  <desc id="desc">虚构的内容工作台和移动端排期面板。选中草稿、预览内容、直接选择日期。这是设计示例，不是已实现的 App 或效果基准。</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#dfe2e8" stroke-width=".8"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#202838" flood-opacity=".09"/></filter>
    <clipPath id="screen"><rect x="842" y="38" width="298" height="578" rx="38"/></clipPath>
  </defs>
  <rect width="1200" height="660" rx="24" fill="#eff1f5"/>
  <rect width="1200" height="660" rx="24" fill="url(#grid)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif" fill="#23262d">
    <circle cx="52" cy="49" r="5" fill="#ed4932"/>
    <text x="68" y="55" font-size="16" font-weight="650" letter-spacing="2">设计，让每一步更顺手。</text>
    <text x="48" y="97" font-size="27" font-weight="600" letter-spacing="-.7">看见内容，就知道下一步。</text>
    <rect x="48" y="133" width="742" height="420" rx="17" fill="#fff" filter="url(#shadow)"/>
    <rect x="48" y="133" width="742" height="420" rx="17" fill="none" stroke="#d6d9df"/>
    <path d="M48 190H790M285 190V553" stroke="#eceef1"/>
    <rect x="69" y="151" width="23" height="23" rx="6" fill="#23262d"/>
    <path d="M75 157h11M75 162h8M75 167h5" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
    <text x="103" y="169" font-size="18" font-weight="650">片刻</text>
    <text x="633" y="168" font-size="14" fill="#747a84">我的工作台</text>
    <circle cx="755" cy="161" r="13" fill="#f0f1f4"/>
    <text x="755" y="166" font-size="12" text-anchor="middle" font-weight="650">J</text>
    <text x="72" y="228" font-size="14" fill="#737986">我的内容</text>
    <path d="M253 216v12M247 222h12" stroke="#747a84" stroke-width="1.6"/>
    <rect x="62" y="245" width="209" height="77" rx="10" fill="#fff0ec"/>
    <rect x="62" y="264" width="3" height="38" rx="1.5" fill="#ed4932"/>
    <text x="79" y="274" font-size="16" font-weight="650">留一点时间，专注</text>
    <circle cx="84" cy="299" r="3" fill="#d7422c"/>
    <text x="94" y="304" font-size="13" fill="#a54836">待发布</text>
    <text x="79" y="355" font-size="15" font-weight="500">试试更短的工作周</text>
    <text x="79" y="378" font-size="13" fill="#747a84">草稿 · 昨天</text>
    <path d="M79 395H252" stroke="#eceef1"/>
    <text x="79" y="425" font-size="15" font-weight="500">我不再做的那些事</text>
    <text x="79" y="448" font-size="13" fill="#747a84">已发布 · 10 月 23 日</text>
    <rect x="75" y="505" width="110" height="24" rx="12" fill="#f4f5f7"/>
    <text x="88" y="521" font-size="12" fill="#747a84">3 篇，按你的节奏</text>
    <text x="314" y="226" font-size="13" fill="#747a84">内容 / 001</text>
    <path d="m712 218 4 4 7-8" stroke="#747a84" stroke-width="1.5" fill="none"/>
