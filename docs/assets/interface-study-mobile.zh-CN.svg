        <text x="882" y="385">一</text><text x="936" y="385">二</text><text x="990" y="385">三</text><text x="1044" y="385">四</text><text x="1098" y="385">五</text>
      </g>
      <rect x="969" y="397" width="43" height="47" rx="14" fill="#ed4932"/>
      <g text-anchor="middle" font-size="18" font-weight="600">
        <text x="882" y="427">26</text><text x="936" y="427">27</text><text x="990" y="427" fill="#fff">28</text><text x="1044" y="427">29</text><text x="1098" y="427">30</text>
      </g>
      <path d="M866 463H1116" stroke="#eceef1"/>
      <text x="866" y="493" font-size="16">时间</text>
      <rect x="1032" y="474" width="85" height="30" rx="7" fill="#f3f4f7"/>
      <text x="1074" y="495" text-anchor="middle" font-size="15" font-weight="600">09:00</text>
      <rect x="864" y="529" width="254" height="48" rx="15" fill="#23262d"/>
      <text x="991" y="559" text-anchor="middle" font-size="16" font-weight="600" fill="#fff">确认排期</text>
      <rect x="945" y="602" width="91" height="4" rx="2" fill="#23262d"/>
    </g>
    <text x="48" y="600" font-size="14" fill="#626a77">清晰的视觉层次</text><path d="M188 595h39" stroke="#c0c5cf"/>
    <text x="248" y="600" font-size="14" fill="#626a77">已有信息直接用</text><path d="M345 595h39" stroke="#c0c5cf"/>
    <text x="405" y="600" font-size="14" fill="#626a77">在内容旁，完成操作</text>
    <text x="48" y="629" font-size="12" fill="#747a84">原创界面示例 · 虚构内容</text>
  </g>
</svg>
