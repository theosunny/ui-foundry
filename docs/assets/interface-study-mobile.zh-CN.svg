    <text x="314" y="278" font-size="28" font-weight="650" letter-spacing="-.7">留一点时间，专注。</text>
    <text x="314" y="312" font-size="15" fill="#747a84">这一次，试着只把一件事做好。</text>
    <rect x="314" y="336" width="446" height="112" rx="9" fill="#f1f2f5"/>
    <path d="M338 420V360M338 420H735" stroke="#cbd0d8"/>
    <path d="M352 407H398V391H445V400H492V370H539V383H586V360H634V375H681V352H726" fill="none" stroke="#242830" stroke-width="3" stroke-linejoin="round"/>
