    <path d="M723 495h13m-5-5 5 5-5 5" fill="none" stroke="#fff" stroke-width="1.6"/>
    <rect x="833" y="29" width="316" height="596" rx="47" fill="#fff" filter="url(#shadow)" stroke="#c8cdd6"/>
    <g clip-path="url(#screen)">
      <rect x="842" y="38" width="298" height="578" fill="#f6f7f9"/>
      <rect x="949" y="48" width="84" height="22" rx="11" fill="#23262d"/>
