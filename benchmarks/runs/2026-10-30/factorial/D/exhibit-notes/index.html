<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exhibit notes</title><style>
:root{--coral:#D85048;--ink:#121212;--muted:#6c6a68;--line:#dedbd8}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:16px/1.45 Arial,sans-serif}main{max-width:1220px;margin:auto;padding:32px}header{border-bottom:4px solid var(--ink);padding-bottom:22px;display:flex;justify-content:space-between;align-items:end;gap:20px}h1{font-family:Georgia,serif;font-size:clamp(2.1rem,5vw,4.2rem);line-height:.95;margin:4px 0 0}.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:var(--coral)}.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:42px;margin-top:30px}nav{border-top:1px solid var(--ink)}.object{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:white;padding:16px 4px;cursor:pointer;font:inherit}.object[aria-current=true]{box-shadow:inset 5px 0 var(--coral);padding-left:14px}.object b{display:block}.object span{color:var(--muted);font-size:.86rem}section{max-width:720px}.title{font-family:Georgia,serif;font-size:clamp(2rem,4vw,3.5rem);line-height:1;margin:0}.medium{font-size:1.05rem;margin:.4rem 0 22px;color:var(--muted)}.credit{border-left:4px solid var(--coral);padding:8px 13px;margin:0 0 28px}.field-label{display:flex;justify-content:space-between;font-size:.85rem;font-weight:800;margin-bottom:8px}textarea{width:100%;min-height:230px;resize:vertical;border:1px solid var(--ink);padding:14px;font:1.08rem/1.5 Georgia,serif}.actions{display:flex;align-items:center;gap:12px;margin-top:13px}button{font:inherit;font-weight:750;cursor:pointer}button.save{background:var(--ink);color:white;border:0;padding:11px 18px}button.cancel{background:white;border:1px solid var(--ink);padding:10px 17px}.state{color:var(--muted);font-size:.88rem;margin-left:auto}@media(max-width:600px){main{padding:20px}.layout{display:block;margin-top:22px}nav{display:flex;overflow:auto;margin:0 -20px 24px;padding:0 20px}.object{min-width:190px;border-top:0;border-right:1px solid var(--line)}.object[aria-current=true]{box-shadow:inset 0 -5px var(--coral);padding-left:4px}.actions{flex-wrap:wrap}.state{margin-left:0;width:100%}textarea{min-height:190px}}
</style></head><body><main><header><div><div class="eyebrow">Collection notes · local demo</div><h1>Exhibit notes</h1></div><div class="eyebrow">Private workspace</div></header><div class="layout"><nav aria-label="Exhibits" id="nav"></nav><section id="editor" aria-live="polite"></section></div></main><script>
const key='uf:exhibit-notes',seed={items:[{id:'p1',title:'After the Rain',medium:'Photography',note:'Notice the reflection.',credit:'Artist A',extra:'keep-item-a'},{id:'p2',title:'Chair by the Sea',medium:'Installation',note:'Visitors may walk around it.',credit:'Artist B',extra:'keep-item-b'}],selectedId:'p1',extra:'preserve-root'};let data;try{data=JSON.parse(localStorage.getItem(key))}catch{}if(!data||typeof data!=='object'||!Array.isArray(data.items)){data=structuredClone(seed);localStorage.setItem(key,JSON.stringify(data))}let drafts={};const persist=()=>localStorage.setItem(key,JSON.stringify(data));const current=()=>data.items.find(x=>x.id===data.selectedId)||data.items[0];
function render(){let item=current();data.selectedId=item.id;document.querySelector('#nav').innerHTML=data.items.map(x=>`<button class="object" aria-current="${x.id===item.id}" data-id="${x.id}"><b>${x.title}</b><span>${x.medium}</span></button>`).join('');let value=drafts[item.id]??item.note;document.querySelector('#editor').innerHTML=`<h2 class="title">${item.title}</h2><p class="medium">${item.medium}</p><p class="credit"><b>Credit</b><br>${item.credit}</p><label class="field-label" for="note">Interpretive note <span id="count">${value.length} characters</span></label><textarea id="note" aria-label="Note for ${item.title}">${value}</textarea><div class="actions"><button class="save" id="save">Save note</button><button class="cancel" id="cancel">Cancel changes</button><span class="state" id="state">${drafts[item.id]!==undefined?'Unsaved draft':'Saved'}</span></div>`;document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const area=document.querySelector('#note');drafts[item.id]=area.value;data.selectedId=b.dataset.id;render()});const area=document.querySelector('#note');area.oninput=()=>{drafts[item.id]=area.value;document.querySelector('#count').textContent=`${area.value.length} characters`;document.querySelector('#state').textContent='Unsaved draft'};document.querySelector('#save').onclick=()=>{item.note=area.value;delete drafts[item.id];persist();render()};document.querySelector('#cancel').onclick=()=>{delete drafts[item.id];render()}}
render();
</script></body></html>
