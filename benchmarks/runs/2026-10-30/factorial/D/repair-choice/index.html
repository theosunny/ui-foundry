<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Repair choice</title><style>
:root{--ink:#17221c;--leaf:#197149;--paper:#f7f6f0;--line:#d9ded6;--soft:#e8f1eb}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 ui-sans-serif,system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;gap:20px;align-items:start;border-bottom:2px solid var(--ink);padding-bottom:22px}h1{font-size:clamp(1.8rem,4vw,3.4rem);line-height:1;margin:0}h2{font-size:1.1rem;margin:0}.eyebrow,.notice{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.notice{background:var(--soft);padding:8px 10px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:28px;margin-top:28px}.quotes{border-top:1px solid var(--line)}.quote{display:grid;grid-template-columns:1.3fr repeat(3,1fr) auto;gap:14px;align-items:center;border-bottom:1px solid var(--line);padding:20px 0}.quote.selected{background:var(--soft);margin:0 -12px;padding:20px 12px}.vendor{font-weight:800;font-size:1.1rem}.meta{font-size:.88rem;color:#4e5d54}.amount{font-size:1.35rem;font-weight:800}.label{display:block;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#556259}.pick,button{font:inherit;font-weight:750;cursor:pointer}.pick{background:white;border:1px solid var(--ink);padding:9px 12px}.pick[aria-pressed=true]{background:var(--ink);color:white}.panel{position:sticky;top:20px;height:max-content;background:white;border:1px solid var(--ink);padding:20px}.panel p{margin:.45rem 0}.fee{font-size:1.8rem;font-weight:850;margin:16px 0!important}button.primary{width:100%;border:0;background:var(--leaf);color:white;padding:12px;margin-top:16px}button.cancel{width:100%;border:1px solid var(--ink);background:white;padding:10px;margin-top:9px}.empty{padding:28px 0;color:#526057}@media(max-width:720px){main{padding:18px}.layout{display:block}.panel{position:static;margin-top:22px}.quote{grid-template-columns:1fr 1fr}.quote .vendor{grid-column:span 2}.pick{grid-column:span 2}.quote.selected{margin:0 -8px;padding:18px 8px}header{display:block}.notice{display:inline-block;margin-top:16px}}
</style></head><body><main><header><div><div class="eyebrow">Home repair · compare before booking</div><h1>Choose your repair visit.</h1></div><div class="notice">Local demo · no vendor request</div></header><div class="layout"><section aria-labelledby="quotes-title"><h2 id="quotes-title">Available quotes</h2><div class="quotes" id="quotes"></div></section><aside class="panel" id="panel" aria-live="polite"></aside></div></main><script>
const key='uf:repair-choice', seed={quotes:[{id:'q1',name:'Green Repair',price:180,time:'Saturday 10:00',warranty:'30 days',rating:'4.8'},{id:'q2',name:'Neighbour Craft',price:220,time:'Saturday 14:00',warranty:'90 days',rating:'4.9'},{id:'q3',name:'Star Service',price:150,time:'Sunday 09:00',warranty:'None',rating:'4.6'}],selectedId:null,booking:null,extra:'preserve-me'};
let data;try{data=JSON.parse(localStorage.getItem(key))}catch{}if(!data||typeof data!=='object'||!Array.isArray(data.quotes)){data=structuredClone(seed);localStorage.setItem(key,JSON.stringify(data))}const save=()=>localStorage.setItem(key,JSON.stringify(data));const find=()=>data.quotes.find(q=>q.id===data.selectedId);
function render(){const q=find();document.querySelector('#quotes').innerHTML=data.quotes.map(x=>`<article class="quote ${x.id===data.selectedId?'selected':''}"><div class="vendor">${x.name}<div class="meta">★ ${x.rating}</div></div><div><span class="label">Fee</span><span class="amount">¥${x.price}</span></div><div><span class="label">Arrival</span>${x.time}</div><div><span class="label">Warranty</span>${x.warranty}</div><button class="pick" aria-pressed="${x.id===data.selectedId}" data-select="${x.id}">${x.id===data.selectedId?'Selected':'Choose'}</button></article>`).join('');document.querySelector('#panel').innerHTML=data.booking?`<div class="eyebrow">Booking confirmed</div><h2>${data.quotes.find(x=>x.id===data.booking.quoteId)?.name||'Repair visit'}</h2><p>Your vendor has not been contacted. This is a local demo.</p><button class="cancel" id="cancel">Cancel booking</button>`:q?`<div class="eyebrow">Ready to confirm</div><h2>${q.name}</h2><p class="fee">¥${q.price}</p><p><b>${q.time}</b> · ${q.warranty} warranty</p><p class="meta">Cancellation: free before arrival.</p><button class="primary" id="confirm">Confirm local booking</button><p class="meta">No payment is taken and no vendor request is sent.</p>`:`<h2>Pick a quote</h2><p class="empty">Compare the fee, appointment time and warranty, then choose a visit.</p>`;document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{data.selectedId=b.dataset.select;save();render()});const confirm=document.querySelector('#confirm');if(confirm)confirm.onclick=()=>{data.booking={quoteId:data.selectedId,status:'confirmed'};save();render()};const cancel=document.querySelector('#cancel');if(cancel)cancel.onclick=()=>{data.booking=null;save();render()}}
render();
</script></body></html>
