<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Exhibit notes — local demo</title>
  <style>
    :root{--ink:#101010;--coral:#D85048;--soft:#f5f3f0;--line:#d9d6d2}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font:16px/1.45 Georgia,serif}button,textarea{font:inherit}main{max-width:1200px;margin:auto;padding:28px 18px 54px}.top{display:flex;justify-content:space-between;gap:20px;align-items:start;border-bottom:3px solid var(--ink);padding-bottom:22px}.top h1{font:800 clamp(2rem,4.5vw,4.2rem)/.9 ui-sans-serif,system-ui,sans-serif;letter-spacing:-.07em;margin:5px 0}.kicker,.save-state{font:700 .72rem/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase}.kicker{color:var(--coral)}.save-state{padding:9px 10px;border:1px solid var(--line);white-space:nowrap}.shell{display:grid;gap:22px;margin-top:22px}.objects{display:flex;gap:10px;overflow:auto;padding-bottom:4px}.object{min-width:195px;text-align:left;background:white;border:1px solid var(--line);padding:14px;border-radius:8px;cursor:pointer}.object[aria-current=true]{border:2px solid var(--coral);box-shadow:4px 4px 0 var(--coral)}.object strong,.object span{display:block}.object span{color:#64615d;font-size:.87rem}.editor{background:#fff;border:1px solid var(--line);padding:clamp(18px,4vw,44px);border-radius:8px}.number{color:var(--coral);font:700 .78rem ui-sans-serif,system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase}.editor h2{font-size:clamp(2rem,4vw,4.1rem);line-height:.98;letter-spacing:-.055em;margin:14px 0 6px}.medium{font:700 1.05rem ui-sans-serif,system-ui,sans-serif}.credit{margin:28px 0 20px;padding-top:14px;border-top:1px solid var(--line);font-size:.92rem}.credit strong{font-family:ui-sans-serif,system-ui,sans-serif}.editor label{display:block;font:700 .82rem ui-sans-serif,system-ui,sans-serif;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px}.editor textarea{display:block;width:100%;min-height:180px;border:1px solid #aaa;padding:15px;resize:vertical;border-radius:2px;line-height:1.5}.actions{display:flex;align-items:center;gap:12px;margin-top:14px}.save{border:0;background:var(--coral);color:white;padding:12px 20px;font-weight:800;cursor:pointer}.cancel{border:0;background:transparent;padding:12px;text-decoration:underline;cursor:pointer}.local{font:italic .87rem/1.4 Georgia,serif;color:#615d59;margin-top:26px}@media(min-width:760px){main{padding-top:54px}.shell{grid-template-columns:260px minmax(0,1fr)}.objects{display:grid;align-content:start;overflow:visible}.object{min-width:0}.editor{min-height:510px}}
  </style>
</head>
<body>
  <main>
    <header class="top"><div><p class="kicker">Collection desk · local demo</p><h1>Exhibit notes</h1></div><p class="save-state" id="state">Saved locally</p></header>
    <section class="shell" aria-label="Exhibit note editor"><nav class="objects" id="objects" aria-label="Exhibits"></nav><article class="editor" id="editor"></article></section>
  </main>
  <script>
    const key="uf:exhibit-notes";
    const initial={items:[{id:"p1",title:"After the Rain",medium:"Photography",note:"Notice the reflection.",credit:"Artist A",extra:"keep-item-a"},{id:"p2",title:"Chair by the Sea",medium:"Installation",note:"Visitors may walk around it.",credit:"Artist B",extra:"keep-item-b"}],selectedId:"p1",extra:"preserve-root"};
    function load(){const raw=localStorage.getItem(key);if(raw===null){localStorage.setItem(key,JSON.stringify(initial));return structuredClone(initial)}try{const saved=JSON.parse(raw);return saved&&typeof saved==="object"&&Array.isArray(saved.items)?saved:(localStorage.setItem(key,JSON.stringify(initial)),structuredClone(initial))}catch{return structuredClone(initial)}}
    let data=load(), drafts={}; const objects=document.querySelector("#objects"),editor=document.querySelector("#editor"),state=document.querySelector("#state");
    const current=()=>data.items.find(item=>item.id===data.selectedId)||data.items[0]; const esc=v=>String(v).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"})[c]);
    function render(){const item=current();objects.innerHTML=data.items.map((p,index)=>`<button class="object" data-id="${esc(p.id)}" aria-current="${p.id===item.id}"><strong>${String(index+1).padStart(2,"0")} · ${esc(p.title)}</strong><span>${esc(p.medium)}</span></button>`).join("");editor.innerHTML=`<p class="number">Object ${String(data.items.indexOf(item)+1).padStart(2,"0")}</p><h2>${esc(item.title)}</h2><p class="medium">${esc(item.medium)}</p><p class="credit"><strong>Credit</strong> · ${esc(item.credit)}</p><label for="note">Curatorial note</label><textarea id="note" aria-describedby="note-help">${esc(drafts[item.id]??item.note)}</textarea><div class="actions"><button class="save" id="save">Save note</button><button class="cancel" id="cancel">Cancel changes</button></div><p class="local" id="note-help">Local demo only. Notes save in this browser; no publishing happens.</p>`;objects.querySelectorAll("button").forEach(btn=>btn.onclick=()=>{drafts[item.id]=document.querySelector("#note").value;data.selectedId=btn.dataset.id;render()});document.querySelector("#note").oninput=()=>{drafts[item.id]=document.querySelector("#note").value;state.textContent="Unsaved draft"};document.querySelector("#save").onclick=()=>{const note=document.querySelector("#note").value;data.items=data.items.map(p=>p.id===item.id?{...p,note}:p);delete drafts[item.id];localStorage.setItem(key,JSON.stringify(data));state.textContent="Saved locally";render()};document.querySelector("#cancel").onclick=()=>{delete drafts[item.id];state.textContent="Changes cancelled";render()}}
    render();
  </script>
</body>
</html>
