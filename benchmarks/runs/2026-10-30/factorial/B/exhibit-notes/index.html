<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notes for the room</title>
<style>
  :root{--ink:#121212;--coral:#D85048;--pale:#f7f5f2;--line:#dedbd7;--muted:#686560}*{box-sizing:border-box}body{margin:0;background:var(--pale);color:var(--ink);font:16px/1.45 Georgia,serif}button,textarea{font:inherit}.app{max-width:1240px;margin:auto;padding:32px}.top{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:20px;margin-bottom:28px}.wordmark{font:bold 28px/1 Arial,sans-serif;letter-spacing:-.06em}.local{font:700 11px/1 Arial,sans-serif;letter-spacing:.1em;color:var(--coral)}h1{font-size:clamp(33px,4vw,55px);line-height:1;margin:0 0 28px;letter-spacing:-.05em}.layout{display:grid;grid-template-columns:310px minmax(0,1fr);gap:44px}.list-label{font:700 11px/1 Arial,sans-serif;letter-spacing:.12em;color:var(--muted);margin-bottom:11px}.exhibit{width:100%;background:transparent;border:0;border-top:1px solid var(--line);padding:17px 5px;text-align:left;cursor:pointer}.exhibit:last-child{border-bottom:1px solid var(--line)}.exhibit[aria-current=true]{color:var(--coral)}.exhibit b{display:block;font-size:19px;line-height:1.15}.exhibit span{font:13px Arial,sans-serif;color:var(--muted)}.editor{background:#fff;padding:clamp(22px,4vw,52px);min-height:510px;border-top:5px solid var(--coral)}.eyebrow{font:700 11px/1 Arial,sans-serif;letter-spacing:.12em;color:var(--coral);margin-bottom:12px}.editor h2{font-size:clamp(31px,4vw,48px);line-height:1;margin:0 0 8px;letter-spacing:-.05em}.medium{margin:0 0 38px;color:var(--muted)}label{display:block;font:700 12px Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}textarea{display:block;width:100%;min-height:170px;resize:vertical;border:1px solid #aaa;padding:14px;background:#fff;color:var(--ink);line-height:1.5}.credit{border-top:1px solid var(--line);margin-top:25px;padding-top:16px;color:var(--muted)}.credit b{color:var(--ink)}.actions{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:20px}.state{font:13px Arial,sans-serif;color:var(--muted)}.action-group{display:flex;gap:8px}.save,.discard{border:0;padding:11px 16px;font:700 14px Arial,sans-serif;cursor:pointer}.save{background:var(--coral);color:white}.discard{background:#eeeae6;color:var(--ink)}@media(max-width:640px){.app{padding:20px}.top{margin-bottom:22px}.layout{grid-template-columns:1fr;gap:24px}.collection{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.list-label{width:100%;position:absolute;clip:rect(0 0 0 0)}.exhibit{border:1px solid var(--line);min-width:210px;padding:12px}.exhibit:last-child{border-bottom:1px solid var(--line)}.editor{min-height:auto;padding:24px}.medium{margin-bottom:22px}.actions{align-items:flex-start;flex-direction:column}.action-group{width:100%}.action-group button{flex:1}}
</style></head><body><main class="app"><header class="top"><div class="wordmark">ROOM NOTES</div><div class="local">LOCAL EDITOR · NOT PUBLISHED</div></header><h1>Exhibit labels, kept close.</h1><div class="layout"><nav class="collection" aria-label="Exhibits"><div class="list-label">In this room</div><div id="list"></div></nav><section class="editor" aria-live="polite" id="editor"></section></div></main>
<script>
const key="uf:exhibit-notes";const initial={items:[{id:"p1",title:"After the Rain",medium:"Photography",note:"Notice the reflection.",credit:"Artist A",extra:"keep-item-a"},{id:"p2",title:"Chair by the Sea",medium:"Installation",note:"Visitors may walk around it.",credit:"Artist B",extra:"keep-item-b"}],selectedId:"p1",extra:"preserve-root"};let state; if(localStorage.getItem(key)===null){state=initial;localStorage.setItem(key,JSON.stringify(state))}else{try{state=JSON.parse(localStorage.getItem(key))}catch{state=initial}}const drafts={};const current=()=>state.items.find(i=>i.id===state.selectedId);const changed=()=>drafts[current().id]!==undefined&&drafts[current().id]!==current().note;const persist=()=>localStorage.setItem(key,JSON.stringify(state));const esc=value=>String(value).replace(/[&<>\"]/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"})[char]);
function render(){const item=current();document.querySelector('#list').innerHTML=state.items.map(x=>`<button class="exhibit" type="button" data-id="${esc(x.id)}" aria-current="${x.id===item.id}"><b>${esc(x.title)}</b><span>${esc(x.medium)}</span></button>`).join('');const value=drafts[item.id]??item.note;document.querySelector('#editor').innerHTML=`<div class="eyebrow">Exhibit note</div><h2>${esc(item.title)}</h2><p class="medium">${esc(item.medium)}</p><label for="note">Visitor note</label><textarea id="note" aria-describedby="save-state">${esc(value)}</textarea><p class="credit">Credit: <b>${esc(item.credit)}</b></p><div class="actions"><span class="state" id="save-state">${changed()?'Unsaved draft':'Saved note'}</span><div class="action-group"><button class="discard" type="button" id="cancel" ${changed()?'':'disabled'}>Restore saved</button><button class="save" type="button" id="save" ${changed()?'':'disabled'}>Save note</button></div></div>`;document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{state.selectedId=b.dataset.id;render()});const note=document.querySelector('#note');note.addEventListener('input',()=>{drafts[item.id]=note.value;document.querySelector('#save-state').textContent='Unsaved draft';document.querySelector('#save').disabled=false;document.querySelector('#cancel').disabled=false});document.querySelector('#save').onclick=()=>{item.note=drafts[item.id];delete drafts[item.id];persist();render()};document.querySelector('#cancel').onclick=()=>{delete drafts[item.id];render()}}
render();
</script></body></html>
