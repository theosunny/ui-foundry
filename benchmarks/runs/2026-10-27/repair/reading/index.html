<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Later — Reading queue</title><style>
:root{--ink:#1c2728;--muted:#677374;--paper:#f5f3ed;--sheet:#fffdf8;--line:#d9d7ce;--blue:#b8d7de;--lime:#d9ed8d;--error:#8b332d}*{box-sizing:border-box}body{margin:0;min-width:320px;color:var(--ink);background:var(--paper);font:16px/1.45 ui-sans-serif,system-ui,sans-serif}button,a{font:inherit}button{color:inherit}button:focus-visible,a:focus-visible{outline:3px solid #216176;outline-offset:3px}.shell{width:min(940px,calc(100% - 48px));margin:auto;padding:30px 0 54px}header{display:flex;align-items:center;justify-content:space-between;padding:0 1px 23px}.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;letter-spacing:-.04em}.brand-mark{display:grid;place-items:center;width:29px;height:29px;border-radius:50%;background:var(--ink);color:var(--lime);font:23px/1 Georgia,serif}.local,.subtitle,.count,.source,.footnote{color:var(--muted)}.local{font-size:13px}.panel{overflow:hidden;border:1px solid var(--line);border-radius:15px;background:var(--sheet);box-shadow:0 15px 44px rgb(35 45 39 / 7%)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:25px 30px 19px;border-bottom:1px solid var(--line)}h1{margin:0;font:700 30px/1 Georgia,serif;letter-spacing:-.05em}.subtitle{margin:7px 0 0;font-size:13px}.budget-label{display:block;margin-bottom:8px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}.budgets{display:flex;flex-wrap:wrap;gap:7px}.budget{min-height:38px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:transparent;cursor:pointer;font-size:13px;font-weight:750}.budget:hover{background:#f0eee6}.budget[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:#fffef9}.content{padding:0 30px 25px}.list-heading{display:flex;align-items:baseline;justify-content:space-between;gap:18px;padding:18px 1px 9px;border-bottom:1px solid var(--line)}.list-heading h2{margin:0;font-size:13px}.count{font-size:12px}.articles{display:grid}.article{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:14px;padding:14px 1px;border-bottom:1px solid var(--line)}.time{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--blue);color:#23454d;font-size:12px;font-weight:850;line-height:1.02;text-align:center}.time span{display:block;font-size:9px;letter-spacing:.06em;text-transform:uppercase}.article-copy{min-width:0}.article-title{color:var(--ink);font-size:16px;font-weight:790;letter-spacing:-.025em;text-decoration:none;text-decoration-thickness:1px;text-underline-offset:3px}.article-title:hover{text-decoration-thickness:2px}.source{margin:3px 0 0;font-size:12px}.read{min-height:37px;padding:0 11px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);cursor:pointer;font-size:12px;font-weight:800;white-space:nowrap}.read:hover{border-color:var(--ink);background:#f3f1e8}.undo,.storage-error{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:16px 0 0;padding:10px 11px 10px 13px;border-radius:9px;font-size:13px}.undo{border:1px solid #c7cfad;background:#f3f8de;color:#435322}.storage-error{border:1px solid #deb5ae;background:#fff1ef;color:var(--error)}.undo button{min-height:33px;padding:0 10px;border:1px solid #65763a;border-radius:7px;background:transparent;color:#435322;cursor:pointer;font-weight:800}.undo[hidden],.storage-error[hidden],.empty[hidden]{display:none}.empty{padding:36px 1px 10px;color:var(--muted)}.empty h2{margin:0 0 6px;color:var(--ink);font:700 24px/1.1 Georgia,serif;letter-spacing:-.04em}.empty p{margin:0}.footnote{margin:17px 1px 0;font-size:12px}@media(max-width:650px){.shell{width:min(100% - 28px,600px);padding-top:18px}.local{display:none}.toolbar{display:block;padding:22px 20px 17px}h1{font-size:28px}.budget-label{margin-top:20px}.content{padding:0 20px 21px}.article{grid-template-columns:42px minmax(0,1fr);gap:12px}.read{grid-column:2;justify-self:start}.undo,.storage-error{align-items:flex-start;flex-direction:column;gap:8px}}@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}</style></head>
<body><main class="shell"><header><div class="brand"><span class="brand-mark" aria-hidden="true">↳</span>Later</div><span class="local">Local reading queue</span></header><section class="panel" aria-labelledby="page-title"><div class="toolbar"><div><h1 id="page-title">Reading queue</h1><p class="subtitle">Saved articles, ready when you are.</p></div><div><span class="budget-label" id="budget-label">Available time</span><div class="budgets" role="group" aria-labelledby="budget-label"><button class="budget" type="button" data-budget="5" aria-pressed="false">5 min</button><button class="budget" type="button" data-budget="15" aria-pressed="false">15 min</button><button class="budget" type="button" data-budget="30" aria-pressed="false">30 min</button><button class="budget" type="button" data-budget="all" aria-pressed="true">Any time</button></div></div></div><div class="content"><div class="storage-error" id="storage-error" role="alert" hidden></div><div class="undo" id="undo" role="status" aria-live="polite" hidden><span id="undo-copy"></span><button type="button" data-action="undo" aria-label="Undo marking article as read">Undo</button></div><div class="list-heading"><h2>Unread</h2><span class="count" id="count"></span></div><div class="articles" id="articles" aria-live="polite"></div><div class="empty" id="empty" hidden><h2 id="empty-title"></h2><p id="empty-copy"></p></div><p class="footnote">This fictional demo saves only in this browser.</p></div></section></main>
<script>
const STORAGE_KEY="uf-reading-benchmark-v1",SEED=[{id:"small",title:"The small team advantage",source:"Field notes",minutes:4,url:"https://example.com/articles/small",done:false,tag:"preserve-small"},{id:"craft",title:"A quieter kind of software",source:"Studio journal",minutes:12,url:"https://example.com/articles/craft",done:false,tag:"preserve-craft"},{id:"tools",title:"When tools get out of the way",source:"Build log",minutes:22,url:"https://example.com/articles/tools",done:false,tag:"preserve-tools"},{id:"defaults",title:"The cost of another choice",source:"Design notes",minutes:8,url:"https://example.com/articles/defaults",done:false,tag:"preserve-defaults"}],$=s=>document.querySelector(s);let budget="all",records=[],lastRead=null,storageProblem="";
function load(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw!==null){const parsed=JSON.parse(raw);if(!Array.isArray(parsed))throw Error();return parsed}const seeded=structuredClone(SEED);localStorage.setItem(STORAGE_KEY,JSON.stringify(seeded));return seeded}catch{storageProblem="Couldn’t access saved queue. Nothing was changed.";return[]}}
function persist(next){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(next));return true}catch{storageProblem="Couldn’t save that change. Your queue is unchanged.";renderProblem();return false}}
function available(){return records.filter(a=>!a.done&&(budget==="all"||a.minutes<=Number(budget)))}function renderProblem(){const e=$("#storage-error");e.textContent=storageProblem;e.hidden=!storageProblem}
function row(a){const r=document.createElement("article");r.className="article";r.dataset.articleId=a.id;const t=document.createElement("div");t.className="time";t.setAttribute("aria-label",a.minutes+" minute read");t.innerHTML=a.minutes+"<span>min</span>";const c=document.createElement("div");c.className="article-copy";const l=document.createElement("a");l.className="article-title";l.href=a.url;l.textContent=a.title;l.setAttribute("aria-label","Open "+a.title);const s=document.createElement("p");s.className="source";s.textContent=a.source;c.append(l,s);const b=document.createElement("button");b.className="read";b.type="button";b.dataset.action="read";b.textContent="Mark read";b.setAttribute("aria-label","Mark "+a.title+" as read");b.addEventListener("click",()=>markRead(a.id));r.append(t,c,b);return r}
function render(){const items=available();$("#count").textContent=items.length+" "+(items.length===1?"article":"articles");$("#articles").replaceChildren(...items.map(row));const e=$("#empty");e.hidden=items.length>0;if(!items.length){const unread=records.some(a=>!a.done);$("#empty-title").textContent=records.length===0?"Your queue is empty.":unread?"Nothing fits that window.":"All caught up.";$("#empty-copy").textContent=records.length===0?"Save an article to see it here.":unread?"Choose a longer reading window.":"Every saved article is marked read."}document.querySelectorAll(".budget").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.budget===budget)));renderProblem()}
function markRead(id){const index=records.findIndex(a=>a.id===id);if(index<0)return;const record=records[index],next=records.map(a=>a.id===id?{...a,done:true}:a);if(!persist(next))return;records=next;lastRead={index,record:structuredClone(record)};$("#undo-copy").textContent="Marked “"+record.title+"” as read.";$(" #undo".trim()).hidden=false;render()}function undo(){if(!lastRead)return;const{index,record}=lastRead,next=records.filter(a=>a.id!==record.id);next.splice(index,0,record);if(!persist(next))return;records=next;lastRead=null;$("#undo").hidden=true;render()}
records=load();document.querySelectorAll("[data-budget]").forEach(b=>b.addEventListener("click",()=>{budget=b.dataset.budget;render()}));$("[data-action='undo']").addEventListener("click",undo);render();
</script></body></html>
