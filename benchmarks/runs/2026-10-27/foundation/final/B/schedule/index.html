<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>小组排期 · UI Foundry reference</title>
  <style>
/* UI Foundry web foundation. Scope with .uf-ui; replace semantic tokens for brand. */
.uf-ui {
  --uf-canvas: #f7f8fa;
  --uf-surface: #ffffff;
  --uf-surface-raised: #ffffff;
  --uf-text: #17202a;
  --uf-muted: #59697d;
  --uf-border: #d9e0e8;
  --uf-accent: #2563eb;
  --uf-accent-strong: #1d4ed8;
  --uf-success: #15803d;
  --uf-warning: #b45309;
  --uf-danger: #b91c1c;
  --uf-focus: #2563eb;
  --uf-radius: 8px;
  --uf-shadow: 0 8px 24px rgb(23 32 42 / 10%);
  --uf-font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --uf-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  --uf-space-1: 4px;
  --uf-space-2: 8px;
  --uf-space-3: 12px;
  --uf-space-4: 16px;
  --uf-space-5: 24px;
  --uf-space-6: 32px;
  color: var(--uf-text);
  background: var(--uf-canvas);
  font: 400 16px/1.55 var(--uf-font);
}

.uf-ui *, .uf-ui *::before, .uf-ui *::after { box-sizing: border-box; }
.uf-ui :where(button, input, select, textarea) { font: inherit; }
.uf-ui :where(button, [role="button"], a, input, select, textarea, summary):focus-visible {
  outline: 3px solid color-mix(in srgb, var(--uf-focus) 70%, transparent);
  outline-offset: 2px;
}
.uf-ui :where(button, [role="button"], a) { -webkit-tap-highlight-color: transparent; }

.uf-page { min-block-size: 100%; padding: var(--uf-space-5); }
.uf-workspace { display: grid; grid-template-columns: minmax(220px, 288px) minmax(0, 1fr); gap: var(--uf-space-4); }
.uf-workspace--inspector { grid-template-columns: minmax(220px, 288px) minmax(0, 1fr) minmax(0, 336px); }
.uf-main { min-inline-size: 0; max-inline-size: 900px; }
.uf-sidebar, .uf-inspector, .uf-surface { background: var(--uf-surface); border: 1px solid var(--uf-border); border-radius: var(--uf-radius); }
.uf-sidebar, .uf-inspector { padding: var(--uf-space-3); }
.uf-surface { padding: var(--uf-space-5); }
.uf-toolbar { display: flex; align-items: center; justify-content: space-between; gap: var(--uf-space-3); min-block-size: 44px; }
.uf-stack { display: grid; gap: var(--uf-space-4); }
.uf-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--uf-space-2); }
.uf-title { margin: 0; font-size: clamp(1.25rem, 1rem + 1vw, 1.75rem); line-height: 1.2; letter-spacing: -0.01em; }
.uf-muted { color: var(--uf-muted); }
.uf-mono { font-family: var(--uf-mono); }

.uf-ui :where(input:not([type="checkbox"]):not([type="radio"]), select, textarea) { inline-size: 100%; min-block-size: 44px; padding: 10px 12px; color: var(--uf-text); background: var(--uf-surface); border: 1px solid var(--uf-border); border-radius: 6px; }
.uf-ui :where(input[type="checkbox"], input[type="radio"]) { inline-size: 18px; block-size: 18px; margin: 0; accent-color: var(--uf-accent); }
.uf-ui textarea { min-block-size: 112px; resize: vertical; }
.uf-ui :where(input, select, textarea):hover { border-color: color-mix(in srgb, var(--uf-border), var(--uf-text) 28%); }
.uf-ui :where(input, select, textarea)[aria-invalid="true"] { border-color: var(--uf-danger); }
.uf-field-error { color: var(--uf-danger); font-size: 0.875rem; }
.uf-ui :where(input, select, textarea):disabled, .uf-is-disabled { color: color-mix(in srgb, var(--uf-muted), var(--uf-surface) 25%); background: color-mix(in srgb, var(--uf-surface), var(--uf-canvas) 45%); border-color: color-mix(in srgb, var(--uf-border), transparent 35%); cursor: not-allowed; opacity: 1; }

.uf-button { display: inline-flex; align-items: center; justify-content: center; gap: var(--uf-space-2); min-block-size: 44px; padding: 0 16px; color: var(--uf-text); background: var(--uf-surface); border: 1px solid var(--uf-border); border-radius: 6px; cursor: pointer; transition: background-color 150ms ease, border-color 150ms ease, transform 150ms ease; }
.uf-button:hover { background: color-mix(in srgb, var(--uf-surface), var(--uf-canvas) 60%); }
.uf-button:active { transform: translateY(1px); }
.uf-button--primary { color: #fff; background: var(--uf-accent); border-color: var(--uf-accent); }
.uf-button--primary:hover { background: var(--uf-accent-strong); border-color: var(--uf-accent-strong); }
.uf-button:disabled { color: color-mix(in srgb, var(--uf-muted), #fff 25%); background: color-mix(in srgb, var(--uf-border), var(--uf-surface) 45%); border-color: transparent; cursor: not-allowed; transform: none; }

.uf-status { display: inline-flex; align-items: center; gap: 6px; font-size: 0.875rem; color: var(--uf-muted); }
.uf-status--success { color: var(--uf-success); }
.uf-status--warning { color: var(--uf-warning); }
.uf-status--danger { color: var(--uf-danger); }
.uf-savebar { position: sticky; inset-block-end: var(--uf-space-4); display: flex; justify-content: space-between; align-items: center; gap: var(--uf-space-3); padding: var(--uf-space-3); background: var(--uf-surface-raised); border: 1px solid var(--uf-border); border-radius: var(--uf-radius); box-shadow: var(--uf-shadow); }

@media (prefers-color-scheme: dark) {
  .uf-ui { --uf-canvas: #101418; --uf-surface: #182027; --uf-surface-raised: #202a33; --uf-text: #f1f5f9; --uf-muted: #a8b4c2; --uf-border: #344250; --uf-accent: #60a5fa; --uf-accent-strong: #93c5fd; --uf-success: #4ade80; --uf-warning: #fbbf24; --uf-danger: #fca5a5; --uf-focus: #93c5fd; --uf-shadow: 0 8px 24px rgb(0 0 0 / 28%); }
  .uf-button--primary { color: #101418; }
}

@media (max-width: 900px) {
  .uf-page { padding: var(--uf-space-4); }
  .uf-workspace { grid-template-columns: 1fr; }
  .uf-sidebar, .uf-inspector { max-inline-size: none; }
  .uf-main { max-inline-size: none; }
}

@media (prefers-reduced-motion: reduce) {
  .uf-ui *, .uf-ui *::before, .uf-ui *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
}

</style>
  <style>
    body { margin: 0; }
    .schedule { min-height: 100svh; }
    .frame { max-width: 1100px; margin: auto; padding: 40px 32px; }
    .brandbar { display: flex; align-items: center; gap: 12px; padding-bottom: 32px; }
    .brandmark { display: grid; grid-template-columns: repeat(2, 6px); gap: 3px; padding: 10px; background: var(--uf-text); border-radius: 10px; }
    .brandmark i { width: 6px; height: 6px; background: var(--uf-surface); border-radius: 1px; }
    .brandbar h1 { margin: 0; font-size: 17px; letter-spacing: .02em; font-weight: 650; }
    .brandbar small { margin-left: auto; font-size: 12px; color: var(--uf-muted); }
    .workbench { display: grid; grid-template-columns: 280px minmax(0,1fr); min-height: 530px; background: var(--uf-surface); border: 1px solid var(--uf-border); border-radius: 16px; overflow: clip; box-shadow: 0 6px 32px rgb(23 32 42 / 3%); }
    .agenda { padding: 26px 16px; background: var(--uf-canvas); border-right: 1px solid var(--uf-border); }
    .list-heading { display: flex; align-items: center; justify-content: space-between; padding: 0 12px 18px; }
    .list-heading h2 { margin: 0; font-size: 13px; font-weight: 600; }
    #count { font-size: 12px; color: var(--uf-muted); font-variant-numeric: tabular-nums; }
    #events { display: grid; gap: 6px; }
    .event { display: flex; align-items: center; gap: 14px; min-width: 0; width: 100%; padding: 14px 12px; border: 1px solid transparent; border-radius: 10px; color: var(--uf-text); background: transparent; text-align: left; cursor: pointer; transition: background-color 140ms ease, border-color 140ms ease; }
    .event:hover { background: var(--uf-surface); }
    .event[aria-current="true"] { background: var(--uf-surface); border-color: var(--uf-border); box-shadow: 0 2px 4px rgb(23 32 42 / 3%); }
    .date-tile { display: grid; flex: 0 0 36px; text-align: center; line-height: 1.15; }
    .date-tile small { font-size: 10px; margin-bottom: 3px; color: var(--uf-muted); }
    .date-tile strong { font-size: 23px; font-weight: 550; font-variant-numeric: tabular-nums; }
    .event[aria-current="true"] .date-tile strong { color: var(--uf-accent-strong); }
    .event-copy { display: grid; min-width: 0; gap: 5px; }
    .event-copy strong { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .event-copy small { font-size: 12px; color: var(--uf-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .editor-pane { min-width: 0; }
    #editor { padding: 28px 38px 0; }
    .object-meta { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 10px; min-height: 24px; font-size: 12px; color: var(--uf-muted); }
    #status { margin: 0; display: inline-flex; align-items: center; gap: 6px; }
    #status::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    #status[data-state="dirty"] { color: var(--uf-warning); }
    #status[data-state="error"] { color: var(--uf-danger); }
    .title-field { position: relative; }
    .field-caption { display: block; font-size: 12px; color: var(--uf-muted); margin: 8px 0 2px; }
    .uf-ui #title { height: 52px; padding: 4px 30px 4px 0; border: 0; border-bottom: 1px solid transparent; border-radius: 0; font-size: 29px; font-weight: 650; letter-spacing: -.02em; }
    .uf-ui #title:hover, .uf-ui #title:focus { border-bottom-color: var(--uf-border); }
    .pencil { position: absolute; right: 2px; bottom: 18px; width: 15px; height: 15px; color: var(--uf-muted); pointer-events: none; }
    .field-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; margin-top: 26px; }
    .field { min-width: 0; }
    .field label { display: block; margin-bottom: 7px; font-size: 12px; font-weight: 550; color: var(--uf-muted); }
    .wide { grid-column: 1 / -1; }
    .uf-ui .field input { background: var(--uf-canvas); border-color: transparent; min-width: 0; }
    .uf-ui .field input:hover { border-color: var(--uf-border); }
    .uf-ui #note { height: 86px; min-height: 70px; padding: 10px 0; border: 0; border-top: 1px solid var(--uf-border); border-radius: 0; }
    .actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 22px; padding: 20px 0 24px; border-top: 1px solid var(--uf-border); background: var(--uf-surface); }
    .shortcut { font-size: 11px; color: var(--uf-muted); }
    .action-buttons { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .uf-button { font-size: 13px; font-weight: 550; }
    .empty { margin: 12px; font-size: 13px; color: var(--uf-muted); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .uf-ui [hidden] { display: none !important; }
    @media (max-width: 680px) {
      .frame { padding: 20px 16px; }
      .brandbar { padding-bottom: 18px; }
      .workbench { display: block; min-height: 0; border-radius: 12px; }
      .agenda { padding: 14px 10px 10px; border-right: 0; border-bottom: 1px solid var(--uf-border); }
      .list-heading { padding: 0 8px 8px; }
      #events { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; padding-bottom: 4px; }
      .event { display: grid; padding: 9px 7px; gap: 8px; }
      .date-tile { display: flex; align-items: baseline; gap: 4px; }
      .date-tile strong { font-size: 20px; }
      .event-copy small { font-size: 11px; }
      #editor { padding: 18px 20px 0; }
      .uf-ui #title { font-size: 25px; height: 44px; min-height: 44px; }
      .object-meta { margin-bottom: 4px; }
      .field-grid { margin-top: 18px; gap: 14px 10px; }
      .uf-ui .field input { padding: 9px; font-size: 16px; }
      .uf-ui #note { font-size: 16px; height: 76px; }
      .actions { margin-top: 14px; padding: 16px 0; position: sticky; bottom: 0; }
      .shortcut { display: none; }
    }
  </style>
</head>
<body>
  <div class="uf-ui schedule">
    <main class="frame">
      <header class="brandbar"><span class="brandmark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><h1>小组排期</h1><small>本地演示</small></header>
      <div class="workbench">
        <aside class="agenda" aria-label="安排列表"><div class="list-heading"><h2>近期安排</h2><span id="count"></span></div><div id="events"></div></aside>
        <section class="editor-pane" aria-label="安排详情">
          <form id="editor">
            <div class="object-meta"><span id="owner"></span><p id="status" role="status" aria-live="polite"></p></div>
            <div class="title-field"><label class="field-caption" for="title">安排名称</label><input id="title" required autocomplete="off"><svg class="pencil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m15 4 5 5M4 20l5-1L20 8a2.8 2.8 0 0 0-4-4L5 15z"/></svg></div>
            <div class="field-grid">
              <div class="field"><label for="date">日期</label><input id="date" type="date" required></div>
              <div class="field"><label for="time">时间</label><input id="time" type="time" required></div>
              <div class="field wide"><label for="location">地点</label><input id="location" placeholder="添加地点" autocomplete="off"></div>
              <div class="field wide"><label for="note">备注</label><textarea id="note" placeholder="添加备注"></textarea></div>
            </div>
            <div class="actions"><span class="shortcut">⌘ / Ctrl + Enter</span><div class="action-buttons"><button id="reset" class="uf-button" type="button" hidden>撤销修改</button><button class="uf-button uf-button--primary" type="submit">保存</button></div></div>
          </form>
        </section>
      </div>
    </main>
  </div>
  <script>
    // Fictional local example. Adapt its domain and storage to the target project.
    const storageKey = 'uf-schedule-benchmark-v1';
    const seed = [
      { id: 'review', title: '方案评审', date: '2026-11-03', time: '10:00', location: '线上', note: '带上交互原型', owner: '团队 A' },
      { id: 'workshop', title: '写作小组', date: '2026-11-05', time: '19:30', location: '二楼活动室', note: '每人带一段草稿', owner: '团队 B' },
      { id: 'walk', title: '周末散步', date: '2026-11-07', time: '09:00', location: '图书馆门口', note: '下雨改约', owner: '团队 C' }
    ];
    const fields = ['title', 'date', 'time', 'location', 'note'];
    const $ = id => document.getElementById(id);
    let storageError = false;
    let records = [];
    try {
      const raw = localStorage.getItem(storageKey);
      const parsed = raw === null ? structuredClone(seed) : JSON.parse(raw);
      if (!Array.isArray(parsed)) throw new Error('Invalid stored list');
      records = parsed;
    } catch { storageError = true; }
    let selectedId = records[0]?.id ?? null;
    const drafts = new Map();
    const selected = () => records.find(record => record.id === selectedId);
    const values = () => Object.fromEntries(fields.map(field => [field, $(field).value]));
    function feedback(message, state = '') { $('status').textContent = message; $('status').dataset.state = state; }
    function remember() {
      const record = selected();
      if (!record) return;
      const data = values();
      if (fields.some(field => data[field] !== String(record[field] ?? ''))) drafts.set(selectedId, data);
      else drafts.delete(selectedId);
      $('reset').hidden = !drafts.has(selectedId);
    }
    function renderList() {
      $('count').textContent = `${records.length} 项`;
      $('events').replaceChildren(...records.map(record => {
        const button = document.createElement('button');
        button.type = 'button'; button.className = 'event';
        button.setAttribute('aria-current', record.id === selectedId ? 'true' : 'false');
        const dateTile = document.createElement('span'); dateTile.className = 'date-tile'; dateTile.setAttribute('aria-hidden', 'true');
        const month = document.createElement('small'), day = document.createElement('strong');
        month.textContent = record.date ? `${Number(record.date.slice(5, 7))} 月` : '日期'; day.textContent = record.date ? record.date.slice(8) : '—';
        dateTile.append(month, day);
        const copy = document.createElement('span'); copy.className = 'event-copy';
        const title = document.createElement('strong'), details = document.createElement('small');
        title.textContent = record.title || '未命名安排'; details.textContent = [record.time, record.location].filter(Boolean).join(' · ');
        copy.append(title, details); button.append(dateTile, copy);
        button.setAttribute('aria-label', [record.title, record.date, record.time, record.location].filter(Boolean).join('，'));
        button.addEventListener('click', () => {
          remember(); selectedId = record.id; fill();
          // Preserve the activated element and keyboard focus during selection.
          document.querySelectorAll('#events button').forEach((item, index) => item.setAttribute('aria-current', records[index].id === selectedId ? 'true' : 'false'));
        });
        return button;
      }));
      if (!records.length) {
        const empty = document.createElement('p'); empty.className = 'empty'; empty.textContent = storageError ? '读取失败，请保留原数据后重试。' : '暂无安排'; $('events').append(empty);
      }
    }
    function fill() {
      const record = selected(), data = record && (drafts.get(selectedId) || record);
      fields.forEach(field => { $(field).value = data?.[field] ?? ''; $(field).disabled = !record; });
      $('editor').querySelector('[type="submit"]').disabled = !record;
      $('owner').textContent = record?.owner || '';
      $('reset').hidden = !drafts.has(selectedId);
      feedback(record ? (drafts.has(selectedId) ? '未保存' : '未修改') : '无可编辑安排', drafts.has(selectedId) ? 'dirty' : '');
    }
    $('editor').addEventListener('input', () => { remember(); feedback(drafts.has(selectedId) ? '未保存' : '未修改', drafts.has(selectedId) ? 'dirty' : ''); });
    $('reset').addEventListener('click', () => { drafts.delete(selectedId); fill(); $('title').focus(); });
    $('editor').addEventListener('submit', event => {
      event.preventDefault(); if (!selected()) return;
      const data = values();
      const next = records.map(record => record.id === selectedId ? { ...record, ...data } : record);
      try { localStorage.setItem(storageKey, JSON.stringify(next)); }
      catch { feedback('保存失败，修改仍保留', 'error'); return; }
      records = next; drafts.delete(selectedId); renderList(); fill(); feedback('已保存');
    });
    $('editor').addEventListener('keydown', event => { if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') { event.preventDefault(); $('editor').requestSubmit(); } });
    renderList(); fill();
  </script>
</body>
</html>
