<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小组排期</title>
  <style>
    :root{--ink:#20262e;--muted:#68727e;--line:#dce2e8;--canvas:#f3f5f7;--paper:#fff;--accent:#165d9f;--soft:#e9f2fa;--focus:#eb9b24}*{box-sizing:border-box}body{margin:0;min-width:320px;background:var(--canvas);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--focus) 70%,white);outline-offset:2px}.topbar{background:#172331;color:#fff;border-bottom:1px solid #0e1821}.topbar-inner,main{max-width:1160px;margin:auto;padding-left:28px;padding-right:28px}.topbar-inner{min-height:96px;display:flex;align-items:center;justify-content:space-between;gap:24px}.eyebrow{margin:0 0 3px;color:#afc9df;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}h1{margin:0;font-size:28px;line-height:1.2;letter-spacing:-.03em}.topbar p{margin:5px 0 0;color:#d5dce2}.count{flex:none;padding:7px 10px;border:1px solid #466176;border-radius:999px;color:#e8f1f8;font-size:13px}main{padding-top:28px;padding-bottom:44px}.intro{margin:0 0 22px}.intro h2{margin:0;font-size:20px;letter-spacing:-.02em}.intro p{margin:4px 0 0;color:var(--muted)}.workspace{display:grid;grid-template-columns:310px minmax(0,1fr);align-items:start;gap:22px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgb(30 45 60/.04)}.list-panel{padding:14px}.panel-title{display:flex;align-items:baseline;justify-content:space-between;padding:3px 6px 12px}.panel-title h3{margin:0;font-size:14px}.panel-title span{color:var(--muted);font-size:12px}#events{display:grid;gap:5px}.event{width:100%;padding:12px;border:1px solid transparent;border-radius:10px;background:transparent;color:inherit;text-align:left}.event:hover{background:#f5f8fa}.event[aria-current="true"]{border-color:#bbd5e9;background:var(--soft)}.event-title,.event-meta{display:block}.event-title{overflow:hidden;font-weight:700;white-space:nowrap;text-overflow:ellipsis}.event-meta{margin-top:3px;color:var(--muted);font-size:13px}.event[aria-current="true"] .event-meta{color:#3c6683}.editor{padding:30px}.editor-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding-bottom:22px;border-bottom:1px solid var(--line)}.editor-head h2{margin:0;font-size:24px;line-height:1.25;letter-spacing:-.03em}.editor-head p{margin:5px 0 0;color:var(--muted)}.draft{flex:none;margin-top:4px;color:var(--muted);font-size:13px}form{padding-top:22px}.field-grid{display:grid;grid-template-columns:1.2fr .8fr .65fr;gap:16px}label{display:block;color:#3c4650;font-size:13px;font-weight:700}input,textarea{display:block;width:100%;margin-top:6px;padding:10px 11px;border:1px solid #b9c3cd;border-radius:8px;background:#fff;color:var(--ink);line-height:1.4}input:hover,textarea:hover{border-color:#8494a2}textarea{min-height:116px;resize:vertical}.wide{margin-top:17px}.actions{display:flex;align-items:center;gap:14px;margin-top:25px;padding-top:20px;border-top:1px solid var(--line)}.primary{padding:10px 16px;border:1px solid var(--accent);border-radius:8px;background:var(--accent);color:#fff;font-weight:700}.primary:hover{background:#104c84}#status{min-height:22px;margin:0;color:#246743;font-size:14px}@media(max-width:760px){.topbar-inner,main{padding-left:18px;padding-right:18px}.topbar-inner{min-height:88px}.count{display:none}.workspace{grid-template-columns:1fr}.list-panel{order:2}.editor{padding:22px 18px}.field-grid{grid-template-columns:1fr;gap:17px}}
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-inner"><div><p class="eyebrow">团队工作台</p><h1>小组排期</h1><p>查看安排，更新时间与地点，留下必要备注。</p></div><span class="count" id="event-count"></span></div></header>
  <main>
    <div class="intro"><h2>近期安排</h2><p>选择一项即可编辑。切换安排时，尚未保存的修改会保留在此页面。</p></div>
    <div class="workspace">
      <aside class="panel list-panel" aria-label="安排列表"><div class="panel-title"><h3>全部安排</h3><span>按日期</span></div><div id="events"></div></aside>
      <section class="panel editor" aria-labelledby="heading">
        <div class="editor-head"><div><h2 id="heading"></h2><p>调整这个安排的内容。</p></div><span class="draft" id="draft-state"></span></div>
        <form id="editor">
          <div class="field-grid"><label for="title">安排名称<input id="title" required></label><label for="date">日期<input id="date" type="date" required></label><label for="time">时间<input id="time" type="time" required></label></div>
          <label class="wide" for="location">地点<input id="location"></label>
          <label class="wide" for="note">备注<textarea id="note" placeholder="可记录参与准备、变更原因等。"></textarea></label>
          <div class="actions"><button class="primary" type="submit">保存修改</button><p id="status" role="status" aria-live="polite"></p></div>
        </form>
      </section>
    </div>
  </main>
  <script>
    const storageKey="uf-schedule-benchmark-v1";
    const seed=[{id:"review",title:"方案评审",date:"2026-11-03",time:"10:00",location:"线上",note:"带上交互原型",owner:"团队 A"},{id:"workshop",title:"写作小组",date:"2026-11-05",time:"19:30",location:"二楼活动室",note:"每人带一段草稿",owner:"团队 B"},{id:"walk",title:"周末散步",date:"2026-11-07",time:"09:00",location:"图书馆门口",note:"下雨改约",owner:"团队 C"}];
    const fields=["title","date","time","location","note"];
    const stored=localStorage.getItem(storageKey);let records;
    try{records=stored===null?seed:JSON.parse(stored)}catch{records=seed}
    if(!Array.isArray(records)||records.length===0)records=seed;
    let selectedId=records[0].id;const drafts=new Map();
    const byId=id=>records.find(record=>record.id===id);
    const currentRecord=()=>byId(selectedId);
    const values=()=>Object.fromEntries(fields.map(field=>[field,document.getElementById(field).value]));
    const labelDate=date=>new Intl.DateTimeFormat("zh-CN",{month:"long",day:"numeric",weekday:"short"}).format(new Date(date+"T12:00:00"));
    function renderList(){const events=document.getElementById("events");events.replaceChildren(...records.map(record=>{const button=document.createElement("button");button.type="button";button.className="event";button.setAttribute("aria-current",String(selectedId===record.id));button.innerHTML='<span class="event-title"></span><span class="event-meta"></span>';button.querySelector(".event-title").textContent=record.title||"未命名安排";button.querySelector(".event-meta").textContent=labelDate(record.date)+" · "+(record.time||"未定");button.addEventListener("click",()=>selectEvent(record.id));return button}));document.getElementById("event-count").textContent=records.length+" 项安排"}
    function isDirty(){const record=currentRecord(),draft=values();return fields.some(field=>draft[field]!==String(record[field]||""))}
    function updateDraftState(){document.getElementById("draft-state").textContent=isDirty()?"未保存的修改":"已保存"}
    function fill(){const record=currentRecord(),draft=drafts.get(selectedId)||record;fields.forEach(field=>document.getElementById(field).value=draft[field]||"");document.getElementById("heading").textContent=draft.title||"未命名安排";document.getElementById("status").textContent="";updateDraftState()}
    function captureDraft(){if(isDirty())drafts.set(selectedId,{...currentRecord(),...values()});else drafts.delete(selectedId)}
    function selectEvent(id){captureDraft();selectedId=id;renderList();fill()}
    document.getElementById("editor").addEventListener("input",()=>{document.getElementById("heading").textContent=document.getElementById("title").value||"未命名安排";updateDraftState()});
    document.getElementById("editor").addEventListener("submit",event=>{event.preventDefault();if(!event.currentTarget.reportValidity())return;records=records.map(record=>record.id===selectedId?{...record,...values()}:record);localStorage.setItem(storageKey,JSON.stringify(records));drafts.delete(selectedId);renderList();fill();document.getElementById("status").textContent="修改已保存"});
    renderList();fill();
  </script>
</body>
</html>
