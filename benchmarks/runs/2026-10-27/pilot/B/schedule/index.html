<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>小组排期</title>
  <style>
    :root{--ink:#17201b;--muted:#627067;--line:#d8e0d9;--paper:#fffef9;--canvas:#eef2ec;--leaf:#1d6b47;--deep:#1b3026;--mint:#e5f2e9;--focus:#175d9b}*{box-sizing:border-box}body{margin:0;min-width:320px;color:var(--ink);background:var(--canvas);font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--focus) 55%,transparent);outline-offset:2px}.topbar{background:var(--deep);color:#f8faf7}.topbar-inner{max-width:1180px;margin:auto;padding:27px 28px 25px;display:flex;align-items:end;justify-content:space-between;gap:24px}.eyebrow{margin:0 0 5px;color:#a8d4b5;font-size:12px;font-weight:750;letter-spacing:.11em}h1,h2,p{margin-top:0}h1{margin-bottom:0;font-family:ui-serif,Georgia,"Noto Serif SC",serif;font-size:clamp(28px,4vw,42px);font-weight:650;line-height:1.12;letter-spacing:-.04em}.today{margin:0 0 3px;color:#d1ddd3;font-size:14px;white-space:nowrap}main{max-width:1180px;margin:0 auto;padding:28px}.intro{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:21px}.intro h2{margin:0 0 4px;font-size:20px;letter-spacing:-.02em}.intro p{margin:0;color:var(--muted)}.draft-note{display:none;padding:7px 10px;border-radius:999px;color:#155238;background:var(--mint);font-size:13px;font-weight:650}.draft-note.visible{display:block}.layout{display:grid;grid-template-columns:minmax(245px,.72fr) minmax(0,1.55fr);gap:22px;align-items:start}.panel{border:1px solid var(--line);border-radius:18px;background:var(--paper);box-shadow:0 10px 25px rgba(30,51,38,.055)}.agenda{padding:17px}.panel-heading{display:flex;align-items:baseline;justify-content:space-between;margin:2px 4px 13px}.panel-heading h2{margin:0;font-size:15px;letter-spacing:.01em}.count{color:var(--muted);font-size:13px}#events{display:grid;gap:7px}.event{width:100%;padding:13px 12px;border:1px solid transparent;border-radius:12px;color:var(--ink);background:transparent;text-align:left;transition:background .15s,border-color .15s}.event:hover{background:#f2f6f1}.event.active{border-color:#b8d4c1;background:var(--mint)}.event-title{display:block;overflow:hidden;font-weight:720;letter-spacing:-.015em;text-overflow:ellipsis;white-space:nowrap}.event-meta{display:block;margin-top:3px;color:var(--muted);font-size:13px}.event.active .event-meta{color:#397054}.editor{padding:clamp(20px,4vw,34px)}.editor-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding-bottom:21px;border-bottom:1px solid var(--line)}.editor h2{margin:0;font-family:ui-serif,Georgia,"Noto Serif SC",serif;font-size:clamp(24px,3vw,32px);letter-spacing:-.035em;line-height:1.2}.selection-meta{margin:7px 0 0;color:var(--muted);font-size:14px}.save-state{min-height:24px;margin:1px 0 0;color:#155238;font-size:14px;font-weight:650;text-align:right}form{padding-top:22px}.field-grid{display:grid;grid-template-columns:1.15fr .85fr .8fr;gap:16px}.field{min-width:0}label{display:block;margin:0 0 6px;font-size:13px;font-weight:720}input,textarea{width:100%;border:1px solid #bdc9bf;border-radius:10px;color:var(--ink);background:#fff;padding:10px 11px;transition:border-color .15s}input:hover,textarea:hover{border-color:#8da292}textarea{min-height:111px;resize:vertical}.location,.note{margin-top:17px}.note label span{color:var(--muted);font-weight:500}.actions{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}.save-hint{margin:0;color:var(--muted);font-size:13px}.primary{padding:10px 17px;border:1px solid var(--leaf);border-radius:10px;color:#fff;background:var(--leaf);font-weight:720;box-shadow:0 3px 0 #155238;transition:transform .15s,background .15s}.primary:hover{background:#155238}.primary:active{transform:translateY(2px);box-shadow:0 1px 0 #155238}@media(max-width:760px){.topbar-inner,main{padding-left:18px;padding-right:18px}.topbar-inner{align-items:flex-start;flex-direction:column;gap:5px}.layout{grid-template-columns:1fr}.agenda{padding:12px}#events{grid-template-columns:repeat(3,minmax(0,1fr))}.event{min-height:82px;padding:10px}.event-meta{line-height:1.35}.field-grid{grid-template-columns:1fr 1fr}.field-title{grid-column:1/-1}}@media(max-width:480px){main{padding-top:21px}.intro{align-items:flex-start;flex-direction:column}#events{grid-template-columns:1fr}.event{min-height:auto}.field-grid{grid-template-columns:1fr}.field-title{grid-column:auto}.actions{align-items:stretch;flex-direction:column-reverse}.primary{width:100%}.save-state{text-align:left}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-inner"><div><p class="eyebrow">HOUSEHOLD PLANNING</p><h1>小组排期</h1></div><p class="today">查看安排，改好就存。</p></div></header>
  <main>
    <div class="intro"><div><h2>接下来安排什么？</h2><p>选择一项查看细节，时间和备注都可直接修改。</p></div><span id="draft-note" class="draft-note">有未保存修改</span></div>
    <div class="layout">
      <aside class="panel agenda" aria-label="安排列表"><div class="panel-heading"><h2>安排</h2><span id="count" class="count"></span></div><div id="events"></div></aside>
      <section class="panel editor" aria-labelledby="heading">
        <div class="editor-head"><div><h2 id="heading">编辑安排</h2><p id="selection-meta" class="selection-meta"></p><p id="owner" class="selection-meta"></p></div><p id="status" class="save-state" role="status" aria-live="polite"></p></div>
        <form id="editor">
          <div class="field-grid"><div class="field field-title"><label for="title">安排名称</label><input id="title" required></div><div class="field"><label for="date">日期</label><input id="date" type="date" required></div><div class="field"><label for="time">时间</label><input id="time" type="time" required></div></div>
          <div class="field location"><label for="location">地点</label><input id="location" autocomplete="off" placeholder="例如：线上或活动室"></div>
          <div class="field note"><label for="note">备注 <span>可选</span></label><textarea id="note" placeholder="保留需要带上或留意的事"></textarea></div>
          <div class="actions"><p class="save-hint">保存只更新当前这项安排。</p><button class="primary" type="submit">保存修改</button></div>
        </form>
      </section>
    </div>
  </main>
  <script>
    const storageKey="uf-schedule-benchmark-v1";
    const seed=[{id:"review",title:"方案评审",date:"2026-11-03",time:"10:00",location:"线上",note:"带上交互原型",owner:"团队 A"},{id:"workshop",title:"写作小组",date:"2026-11-05",time:"19:30",location:"二楼活动室",note:"每人带一段草稿",owner:"团队 B"},{id:"walk",title:"周末散步",date:"2026-11-07",time:"09:00",location:"图书馆门口",note:"下雨改约",owner:"团队 C"}];
    const fields=["title","date","time","location","note"];
    let stored=localStorage.getItem(storageKey),records;
    try{records=stored===null?seed:JSON.parse(stored)}catch{records=seed}
    if(!Array.isArray(records)||records.length===0)records=seed;
    let selectedId=records[0].id;const drafts=new Map();
    const byId=(id)=>document.getElementById(id);const selected=()=>records.find((record)=>record.id===selectedId);
    const meta=(record)=>`${record.date||"未填写日期"} · ${record.time||"未填写时间"}`;
    const values=()=>Object.fromEntries(fields.map((field)=>[field,byId(field).value]));
    function draftState(){byId("draft-note").classList.toggle("visible",drafts.size>0)}
    function saveDraft(){drafts.set(selectedId,values());draftState()}
    function renderList(){byId("count").textContent=`${records.length} 项`;byId("events").replaceChildren(...records.map((record)=>{const button=document.createElement("button"),title=document.createElement("span"),detail=document.createElement("span");button.type="button";button.className=`event${selectedId===record.id?" active":""}`;button.setAttribute("aria-current",selectedId===record.id?"true":"false");title.className="event-title";title.textContent=record.title||"未命名安排";detail.className="event-meta";detail.textContent=meta(record);button.append(title,detail);button.onclick=()=>{if(record.id!==selectedId){saveDraft();selectedId=record.id;fill();renderList()}};return button}))}
    function fill(){const record=selected(),data=drafts.get(selectedId)||record;fields.forEach((field)=>{byId(field).value=data[field]??""});byId("heading").textContent=data.title||"未命名安排";byId("selection-meta").textContent=meta(data);byId("owner").textContent=record.owner?`负责小组 · ${record.owner}`:"";byId("status").textContent=drafts.has(selectedId)?"当前修改尚未保存":"";draftState()}
    function editing(){const data=values();byId("heading").textContent=data.title||"未命名安排";byId("selection-meta").textContent=meta(data);byId("status").textContent="当前修改尚未保存";saveDraft()}
    byId("editor").addEventListener("input",editing);
    byId("editor").addEventListener("submit",(event)=>{event.preventDefault();const data=values();records=records.map((record)=>record.id===selectedId?{...record,...data}:record);localStorage.setItem(storageKey,JSON.stringify(records));drafts.delete(selectedId);renderList();fill();byId("status").textContent="已保存到此安排"});
    renderList();fill();
  </script>
</body>
</html>
